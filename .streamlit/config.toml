# Tema da interface do Glaux: escuro, neutro, com uma única cor de destaque.
[theme]
base = "dark"
primaryColor = "#6C8EFF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161A23"
textColor = "#E6E8EC"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
